version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: compliance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: compliance_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7-alpine
    container_name: compliance_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
  backend:
    build: ./backend
    container_name: compliance_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/compliance_tracker
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
  redisdata:
