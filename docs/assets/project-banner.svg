<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Compliance Renewal Tracker</title>
  <desc id="description">A software engineering project for registering obligations, renewing certificates and reviewing their history.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="1" stop-color="#173b60"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#79b9d5" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
  <circle cx="1130" cy="40" r="180" fill="#2f7c9c" opacity=".12"/>
  <circle cx="50" cy="320" r="170" fill="#2563eb" opacity=".08"/>
  <path d="M0 168 H1200" stroke="#65b8d1" stroke-opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="45" fill="#90c8dd" font-size="13" font-weight="700" letter-spacing="2.6">UCS503 · SOFTWARE ENGINEERING · TIET</text>
    <text x="600" y="103" fill="#f3f8ff" font-size="44" font-weight="700" letter-spacing="-.8">Compliance Renewal Tracker</text>
    <text x="600" y="140" fill="#bcd1e4" font-size="20">Track obligations. Manage renewals. Preserve certificate history.</text>
  </g>
  <g fill="#142c47" stroke="#426984" stroke-width="1">
    <rect x="128" y="200" width="268" height="76" rx="10"/>
    <rect x="466" y="200" width="268" height="76" rx="10"/>
    <rect x="804" y="200" width="268" height="76" rx="10"/>
  </g>
  <g fill="none" stroke="#79b9d5" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M408 238 H452"/>
    <path d="M746 238 H790"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="#f3f8ff" font-size="20" font-weight="700">
      <text x="262" y="232">Register</text>
      <text x="600" y="232">Renew</text>
      <text x="938" y="232">Review</text>
    </g>
    <g fill="#a9c5d9" font-size="14">
      <text x="262" y="255">Obligations and ownership</text>
      <text x="600" y="255">Certificate cycles and reminders</text>
      <text x="938" y="255">Evidence and historical coverage</text>
    </g>
  </g>
</svg>
